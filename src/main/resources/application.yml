# ============================================================
# MentalMadad Backend — Application Configuration
#
# Profile model (Spring Boot profiles):
#   * default profile (active when no profile is specified):
#       H2 in-memory database for local development.
#   * prod profile (activate with --spring.profiles.active=prod):
#       PostgreSQL for production. Full configuration lives in
#       application-prod.yml (loaded automatically when the
#       "prod" profile is active).
# ============================================================

# ------------------------- Common config (all profiles) -------------------------

server:
  # Port is driven by the PORT environment variable (default 8080) so the
  # container can listen on the port App Runner / the platform injects.
  port: ${PORT:8080}

spring:
  application:
    name: mentalmadad-backend

# JWT Configuration
app:
  jwt:
    secret: mentalmadad-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 3600000       # 1 hour
    refresh-expiration-ms: 604800000  # 7 days
  # AI assistant provider selection.
  # local = self-contained rule/keyword engine (no external API key, zero budget).
  # A real LLM provider can be plugged in later by implementing the AiProvider
  # interface and setting app.ai.provider=<name> — controllers/services don't change.
  ai:
    provider: local
  # ------------------------------------------------------------------
  # TrendPulse — daily trend analysis engine
  # ------------------------------------------------------------------
  trends:
    # Ordered provider chain; the first available source that returns data wins.
    # wikipedia-pageviews is a public, documented API publishing DAILY numbers;
    # synthetic is a deterministic offline generator so the product still works
    # with no network (local dev, CI, demos).
    providers: ${APP_TRENDS_PROVIDERS:wikipedia-pageviews,synthetic}
    cache-ttl-seconds: ${APP_TRENDS_CACHE_TTL:900}
    cache-max-entries: 2000
    http-timeout-ms: 4000
    # Wikimedia requires a contact string in the User-Agent — set a real one per deployment.
    user-agent: ${APP_TRENDS_USER_AGENT:TrendPulse/1.0 (https://mentalmadad.com; contact@mentalmadad.com)}
    # Nightly warm + alerting. Disable on all but one replica when scaling out.
    refresh-enabled: ${APP_TRENDS_REFRESH_ENABLED:true}
    refresh-cron: ${APP_TRENDS_REFRESH_CRON:0 15 3 * * *}
    refresh-window-days: 120
  # ------------------------------------------------------------------
  # Billing — subscriptions for TrendPulse
  #
  # provider=mock (default): no keys, no network; checkout is simulated locally
  #   so the whole upgrade flow can be exercised in development.
  # provider=stripe: real payments. Set the four STRIPE_* variables; the secret
  #   key and webhook secret must come from the environment, never the repo.
  # ------------------------------------------------------------------
  billing:
    provider: ${APP_BILLING_PROVIDER:mock}
    currency: ${APP_BILLING_CURRENCY:usd}
    success-url: ${APP_BILLING_SUCCESS_URL:http://localhost:3000/billing/success}
    cancel-url: ${APP_BILLING_CANCEL_URL:http://localhost:3000/pricing}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      price-pro: ${STRIPE_PRICE_PRO:}
      price-business: ${STRIPE_PRICE_BUSINESS:}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Logging
logging:
  level:
    com.mentalmadad: DEBUG
    org.springframework.security: INFO

---
# ------------------------- default profile (dev: H2 in-memory) -------------------------

spring:
  config:
    activate:
      on-profile: default

  # H2 in-memory database for development
  datasource:
    url: jdbc:h2:mem:mentalmadad;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (accessible at /h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Hibernate creates/drops the schema on every dev restart
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Run data.sql AFTER Hibernate has created the tables (create-drop).
    # (Spring Boot runs SQL init scripts after JPA init when this is true.)
    defer-datasource-initialization: true

  # Seed data (always run so the dev DB has test users on every boot)
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
